services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: fisio_registros
      POSTGRES_USER: fisio
      POSTGRES_PASSWORD: fisio_local
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fisio -d fisio_registros"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
